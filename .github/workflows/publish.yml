name: Publish

# Publicação no npm por OIDC (trusted publishing), sem token guardado.
# Disparada por tag vX.Y.Z. O workflow só ENVIA a versão para a área de espera
# (npm stage publish); quem aprova é uma pessoa, no npm, com 2FA.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    name: Enviar versão para aprovação no npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # exigido pelo OIDC do npm; sem ele não há publicação
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Conferir tag e origem
        env:
          TAG: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$TAG" != "v$version" ]; then
            echo "A tag $TAG não bate com a versão $version do package.json."
            exit 1
          fi
          git fetch --quiet origin main
          if ! git merge-base --is-ancestor "$SHA" origin/main; then
            echo "O commit da tag não está na main. Só se publica o que passou por PR."
            exit 1
          fi

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      # O npm que vem com o Node 24 não tem "npm stage". Versão fixada de propósito:
      # atualize junto com o RELEASING.md quando mudar.
      - name: Atualizar o npm
        run: npm install -g npm@12.2.3 && npm --version

      - run: npm ci
      - run: npm test

      - name: Enviar para a área de espera
        run: npm stage publish
